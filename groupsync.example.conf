/*
 * groupsync — pulls per-channel role flags from api.fuelrats.com and authorizes
 * them through ChanServ. Load AFTER chanserv/nickserv. Add to services.conf
 * alongside the other `module { name = "..." }` blocks.
 */
module
{
	name = "groupsync"

	/* Base URL of the API's groupsync endpoints (no trailing slash).
	 * The module calls GET <apiurl>/anope?email=<email> and
	 * POST <apiurl>/anope/bulk. */
	apiurl = "https://api.fuelrats.com"

	/* Path to a 0600 file containing ONLY the bearer token (anope.read scope).
	 * Kept out of the config so the token isn't in restic config snapshots. */
	apitokenfile = "/anope/conf/groupsync.token"

	/* Optional: max seconds a single API request may take (default 5). */
	#apitimeout = 5

	/* Optional (Add-on B): emit the `fr_gated` client ModData used by the
	 * UnrealIRCd `m_rolesync` module to let role-holders into invite-only (+i)
	 * channels. Leave off until `m_rolesync` is loaded on every IRC server;
	 * when off, no ModData is sent (default off). */
	#rolesync = yes
}

/* Exposes NickServ GROUPSYNC <email> (oper/U-lined) — the API's push-trigger
 * calls this to re-sync a user without re-login. */
command { service = "NickServ"; name = "GROUPSYNC"; command = "nickserv/groupsync" }
